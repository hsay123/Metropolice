<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-label="Synthetic demo image: a table with a cup, a pen and a small red block">
  <defs>
    <radialGradient id="light" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f4f2ee"/>
      <stop offset="100%" stop-color="#c7c4bd"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9cdb8"/>
      <stop offset="100%" stop-color="#c3b59c"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="960" fill="url(#light)"/>
  <rect x="60" y="120" width="1160" height="780" rx="28" fill="url(#table)"/>
  <rect x="60" y="120" width="1160" height="780" rx="28" fill="url(#grain)"/>
  <rect x="60" y="120" width="1160" height="780" rx="28" fill="none" stroke="#a99a7f" stroke-width="3"/>

  <!-- cup -->
  <g transform="translate(320 420)">
    <ellipse cx="0" cy="150" rx="150" ry="34" fill="#000" opacity="0.14" filter="url(#soft)"/>
    <path d="M-118 -70 L-96 120 Q0 150 96 120 L118 -70 Z" fill="#3f4750"/>
    <ellipse cx="0" cy="-70" rx="118" ry="40" fill="#59626d"/>
    <ellipse cx="0" cy="-70" rx="96" ry="30" fill="#2b3138"/>
    <ellipse cx="0" cy="-68" rx="88" ry="25" fill="#5b3b22"/>
  </g>

  <!-- pen -->
  <g transform="translate(690 560) rotate(-24)">
    <rect x="-220" y="-9" width="440" height="18" rx="9" fill="#1f2933"/>
    <rect x="-220" y="-9" width="120" height="18" rx="9" fill="#38424d"/>
    <polygon points="220,-9 250,0 220,9" fill="#c9ccd1"/>
    <polygon points="246,-2 258,0 246,2" fill="#2b3138"/>
  </g>

  <!-- red block -->
  <g transform="translate(520 645)">
    <ellipse cx="0" cy="72" rx="96" ry="20" fill="#000" opacity="0.16" filter="url(#soft)"/>
    <rect x="-80" y="-60" width="160" height="130" rx="10" fill="#c0392b"/>
    <rect x="-80" y="-60" width="160" height="26" rx="10" fill="#e05a4b"/>
    <rect x="-80" y="-60" width="160" height="130" rx="10" fill="none" stroke="#8f2a1f" stroke-width="3"/>
  </g>

  <!-- calibration target, top-right corner -->
  <g transform="translate(1090 220)" opacity="0.8">
    <circle r="46" fill="#f8f6f2" stroke="#7a8493" stroke-width="2"/>
    <circle r="32" fill="none" stroke="#7a8493" stroke-width="2"/>
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#7a8493" stroke-width="2"/>
    <line x1="0" y1="-46" x2="0" y2="46" stroke="#7a8493" stroke-width="2"/>
    <circle r="6" fill="#1f4fe0"/>
  </g>
</svg>
